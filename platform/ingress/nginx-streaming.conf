# Nginx Ingress Configuration for Real-Time Streaming LLM Serving
# Production tuned for Server-Sent Events (SSE) and zero-buffering

worker_processes auto;
events {
    worker_connections 2048;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    upstream llm_backend {
        server 127.0.0.1:11434;
        keepalive 32;
    }

    server {
        listen 8080;
        server_name localhost;

        location /v1/ {
            proxy_pass http://llm_backend;
            proxy_http_version 1.1;

            # Critical SSE streaming directives (prevent buffer bloat)
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_cache off;
            proxy_set_header X-Accel-Buffering no;
            chunked_transfer_encoding on;

            # Prevent premature timeouts during long generation runs
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            proxy_connect_timeout 10s;

            # Forward standard ingress metadata
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Health endpoint for upstream readiness checks
        location /healthz {
            return 200 '{"status":"healthy","ingress":"nginx"}\n';
            add_header Content-Type application/json;
        }
    }
}
