# LLM Inference Worker Deployment requesting 1 GPU unit
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-inference-worker
  namespace: default
  labels:
    app: llm-inference-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: llm-inference-worker
  template:
    metadata:
      labels:
        app: llm-inference-worker
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      nodeSelector:
        accelerator: nvidia-simulated
      tolerations:
        - key: "nvidia.com/gpu"
          operator: "Exists"
          effect: "NoSchedule"
      containers:
        - name: inference-server
          image: python:3.11-slim
          command:
            - python
            - -c
            - |
              import http.server, time
              # Simulating lightweight worker with metrics and health checks
              class InferenceHandler(http.server.SimpleHTTPRequestHandler):
                  def do_GET(self):
                      if self.path == '/health/live':
                          self.send_response(200); self.end_headers(); self.wfile.write(b"OK")
                      elif self.path == '/health/ready':
                          self.send_response(200); self.end_headers(); self.wfile.write(b"READY")
                      elif self.path == '/metrics':
                          self.send_response(200); self.end_headers()
                          self.wfile.write(b"# HELP http_requests_in_flight Current in-flight requests\n")
                          self.wfile.write(b"# TYPE http_requests_in_flight gauge\n")
                          self.wfile.write(b"http_requests_in_flight 0\n")
                      else:
                          self.send_response(200); self.end_headers(); self.wfile.write(b"Generated tokens")
              server = http.server.HTTPServer(('0.0.0.0', 8000), InferenceHandler)
              server.serve_forever()
          ports:
            - containerPort: 8000
              name: http
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
              nvidia.com/gpu: "1"
            limits:
              cpu: "1000m"
              memory: "1Gi"
              nvidia.com/gpu: "1"
---
apiVersion: v1
kind: Service
metadata:
  name: llm-inference-service
  namespace: default
  labels:
    app: llm-inference-worker
spec:
  type: ClusterIP
  ports:
    - port: 8000
      targetPort: 8000
      name: http
  selector:
    app: llm-inference-worker
