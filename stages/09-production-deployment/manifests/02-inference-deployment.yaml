apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-inference-worker
  namespace: default
  labels:
    app: llm-inference-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: llm-inference-worker
  template:
    metadata:
      labels:
        app: llm-inference-worker
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      # SRE RULE: Ensure in-flight inference streams finish before container termination
      terminationGracePeriodSeconds: 60
      nodeSelector:
        accelerator: nvidia-l4
      containers:
        - name: inference-engine
          image: ghcr.io/srinivassarkar/llama-server:latest
          command:
            - /usr/local/bin/llama-server
            - -m
            - /opt/models/Qwen2.5-Coder-1.5B-Instruct-Q4_K_M.gguf
            - -ngl
            - "99"
            - --parallel
            - "8"
            - -c
            - "16384"
            - -fa
            - "on"
            - --metrics
            - --port
            - "8000"
            - --host
            - "0.0.0.0"
          ports:
            - containerPort: 8000
              name: http
          # GRACEFUL DRAIN PREVENTS HTTP 502 / DROPPED STREAMS ON SCALE-DOWN
          lifecycle:
            preStop:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - "curl -s -X GET http://127.0.0.1:8000/health/drain && sleep 15"
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 2
            timeoutSeconds: 1
            failureThreshold: 2
          resources:
            requests:
              cpu: "2000m"
              memory: "4Gi"
              nvidia.com/gpu: "1"
            limits:
              cpu: "4000m"
              memory: "8Gi"
              nvidia.com/gpu: "1"
---
apiVersion: v1
kind: Service
metadata:
  name: llm-inference-service
  namespace: default
  labels:
    app: llm-inference-worker
spec:
  type: ClusterIP
  ports:
    - port: 8000
      targetPort: 8000
      name: http
  selector:
    app: llm-inference-worker
