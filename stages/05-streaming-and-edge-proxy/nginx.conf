worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 2048;
}

http {
    access_log /tmp/nginx_access.log;
    error_log /tmp/nginx_error.log;

    upstream llama_backend {
        server 127.0.0.1:8080;
        keepalive 64;  # Requires HTTP/1.1 and Connection "" below
    }

    # PORT 8000: OPTIMAL UNBUFFERED STREAMING (proxy_buffering off)
    server {
        listen 8000;
        server_name localhost;

        location / {
            proxy_pass http://llama_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            # CRITICAL FOR SSE STREAMING:
            proxy_buffering off;
            proxy_cache off;
            gzip off;  # Compression buffers chunks in memory; must be disabled for SSE

            # DOWNSTREAM CDN / PROXY SIGNAL:
            add_header X-Accel-Buffering no;

            # BACKPRESSURE PROPAGATION:
            proxy_ignore_client_abort off;  # Terminates upstream compute when client disconnects

            # TIMEOUT TUNING FOR LONG GENERATIONS:
            proxy_connect_timeout 10s;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;

            # HEADER FORWARDING:
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }

    # PORT 8001: ANTI-PATTERN BUFFERED STREAMING (proxy_buffering on)
    server {
        listen 8001;
        server_name localhost;

        location / {
            proxy_pass http://llama_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            # BUFFER BLOAT ANTI-PATTERN:
            proxy_buffering on;
            proxy_buffers 8 4k;
            proxy_buffer_size 4k;

            proxy_connect_timeout 10s;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
